<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Shipping</h1>
</header>

<main>
    <form>

        <fieldset>
            <legend>Login</legend>

            <div class="form-row">
                <label for="user">User Name:</label>
                <input type="text" id="user" name="user">
            </div>

            <div class="form-row">
                <label for="weight">Password:</label>
                <input type="password" id="password" name="password">
            </div>

            <div class="form-row">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email">
            </div>

        </fieldset>

        <fieldset>
            <legend>Personal Information</legend>
    
            <div class="form-row">
                <label for="zip">Zip Code:</label>
                <input type="text" id="zip" name="zip">
            </div>

            <div class="form-row">
                <label for="weight">Weight (grams):</label>
                <input type="text" id="weight" name="weight">
            </div>

            <div class="form-row">
                <label for="dimension">Dimensions (l in, w in, h in):</label>
                <input type="text" id="dimension" name="dimension">
            </div>

            <div class="form-row">
                <label for="bio">Special Instructions:</label>
                <textarea id="bio" name="bio"></textarea>
            </div>

        </fieldset>

        <fieldset>
            <legend>Preferences</legend>

            <div class="form-row checkbox-row">
                <input type="checkbox" id="terms" name="terms">
                <label for="terms">I agree to the terms</label>
            </div>

            <div class="form-row">
                <span>Choose an insurance plan:</span>

                <label class="radio-label">
                    <input type="radio" name="plan" value="none">
                    None
                </label>

                <label class="radio-label">
                    <input type="radio" name="plan" value="basic">
                    Basic
                </label>

                <label class="radio-label">
                    <input type="radio" name="plan" value="premium">
                    Premium
                </label>
            </div>

            <div class="form-row">
                <label for="color">Packing:</label>
                <select id="color" name="color">
                    <option value=""></option>
                    <option>Basic</option>
                    <option>Strong</option>
                    <option>Strongest</option>
                </select>
            </div>

        </fieldset>

        <button type="submit" class="submit-btn">Submit</button>

    </form>
</main>
